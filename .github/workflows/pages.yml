name: Publish website to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/**'
      - 'supabase/**'
      - 'scripts/update-oil.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ""
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci --prefix tests --no-audit --no-fund
      - name: Check JavaScript
        run: |
          node --check docs/app.mjs
          node --check docs/home.mjs
          node --check docs/calc.mjs
          node --check docs/tables.mjs
          node --check docs/reference-data.mjs
          node tests/reference-data.test.mjs
          node --check docs/team/app.mjs
          node --check docs/team/api.mjs
          node --check docs/team/analytics-view.mjs
          node --check docs/team/analytics-model.mjs
          node tests/analytics-model.test.mjs
          node tests/analytics-ui.test.mjs
          node tests/oil-data.test.mjs
          node tests/team-model.test.mjs
          node tests/team-db.test.mjs
          node tests/freight-v2-db.test.mjs
          node tests/currency-fields.test.mjs
          node tests/login-install.test.mjs
          node tests/team-ui.test.mjs
          TEAM_TEST_ROLE=sales node tests/team-ui.test.mjs
          TEAM_TEST_ROLE=lead node tests/team-ui.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
